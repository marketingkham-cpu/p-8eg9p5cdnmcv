:root{--bg:#F7F8FA;--surface:#fff;--ink:#1F2F3C;--night:#1F2F3C;--muted:#5B6478;--line:#DCE1EC;--accent:#5E76B3;--soft:#E4E9F6;--peri:#8FA7D2;--perisoft:#B4C5E6;--butter:#EEE5A4;--butterdk:#C9B75A;--blush:#F4E4DC;--ok:#2F7D5B;--warn:#A8741A;--bad:#A8443A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--night);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header .t{font-weight:800;font-size:18px;letter-spacing:-.2px}
header .s{font-size:13px;color:var(--perisoft);margin-top:2px}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.logo{font-family:'Hanken Grotesk',sans-serif;font-weight:500;font-size:20px;letter-spacing:-.035em;color:#fff;line-height:1}
.logo i{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:600;font-size:1.12em}
.logo.dark{color:var(--night)}
.brand .tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--butter)}
.foot{text-align:center;margin:26px 0 6px;color:var(--muted);font-size:12px}
.foot .logo{font-size:22px;color:var(--accent);display:block;margin-bottom:4px}
main{max-width:640px;margin:0 auto;padding:14px 14px 30px}
h2{font-size:17px;margin:20px 2px 10px}
h3{font-size:15px;margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent)}
.pill.ok{background:#E2F1EA;color:var(--ok)}.pill.warn{background:#F6EED9;color:var(--warn)}.pill.bad{background:#F6E2DF;color:var(--bad)}.pill.butter{background:var(--butter);color:#5d531a}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.full{width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:0;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:10px}
nav button.on{color:var(--accent);background:var(--soft)}
nav svg{width:22px;height:22px}
/* timeline */
.tl{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.wk{border-radius:10px;padding:7px 2px 6px;text-align:center;border:1.5px solid transparent;cursor:pointer}
.wk b{display:block;font-size:13px}
.wk .dots{display:flex;justify-content:center;gap:3px;margin-top:4px}
.wk .dot{width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid var(--peri)}
.wk .dot.done{background:var(--ok);border-color:var(--ok)}
.wk.now{border-color:var(--night);box-shadow:0 0 0 2px var(--butter)}
.f1{background:var(--blush)}.f2{background:var(--butter)}.f3{background:#DCE4F4}.f4{background:#B9C8E6}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}
/* session list */
.sess{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
/* exercise */
.ex{padding:0;overflow:hidden}
.ex .anim{background:linear-gradient(#F7F9FD,#EEF2FA);border-bottom:1px solid var(--line);position:relative}
.ex .anim svg{display:block;width:100%;height:auto;max-height:230px}
.ex .lab{position:absolute;left:10px;bottom:8px;background:rgba(255,255,255,.92);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--ink)}
.ex .vt{position:absolute;right:10px;top:8px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:2px 6px}
.ex .pz{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted)}
.ex .body{padding:12px 14px 14px}
.ex .num{font-size:12px;font-weight:800;color:var(--accent)}
.ex .name{font-weight:800;font-size:16px;margin:2px 0 4px}
.dose{background:var(--soft);border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px;margin:8px 0}
ul.cues{margin:6px 0 0;padding-left:18px;font-size:14px}ul.cues li{margin:3px 0}
.caution{background:#F6EED9;color:#6b4a0e;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-weight:700;font-size:13px;color:var(--accent)}
.seg button.on{background:var(--accent);color:#fff}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.scale button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 0 6px;font-weight:800;font-size:16px;color:var(--ink);line-height:1}
.scale button small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);margin-top:3px}
.scale button.on.v1{background:#DDF0E6;border-color:var(--ok)}
.scale button.on.v2{background:#E9F3D8;border-color:#6b8f2f}
.scale button.on.v3{background:#F6EED9;border-color:var(--warn)}
.scale button.on.v4{background:#F7E1D6;border-color:#c06a3a}
.scale button.on.v5{background:#F6DCD8;border-color:var(--bad)}
.qlab{font-size:13px;font-weight:800;margin-top:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--ok)}
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent);margin-top:8px}
.lvls{font-size:13px;margin-top:6px}.lvls div{padding:5px 0;border-top:1px dashed var(--line)}
.block{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 2px 8px}
.chart svg{width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.filter button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.filter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

<script>
/* =========================================================
   1. FIGURA ANIMADA (todo en SVG, funciona sin internet)
   ========================================================= */
const LEN={trunk:60,head:18,hr:9,ua:26,fa:24,th:40,sh:38,ft:11};
const R=Math.PI/180;
const dir=a=>[Math.cos(a*R),Math.sin(a*R)];
const add=(p,v,k)=>[p[0]+v[0]*k,p[1]+v[1]*k];
function norm(p){
  const n=Object.assign({ua:0,fa:0,th:0,sh:0,ft:-80,la:1,lt:1,ls:1,lf:1},p.n||{});
  const f=Object.assign({},n,p.f||{});
  return {mat:p.mat,px:p.px,py:p.py,T:p.T,bend:p.bend||0,hd:(p.hd==null?p.T:p.hd),w:p.w||0,sc:p.sc||1,lT:p.lT||1,hdist:p.hdist||20,fr:(p.fr==null?-90:p.fr),face:(p.face==null?null:p.face),lr:p.lr||null,farP:!!p.farP,n,f};
}
function lerp(a,b,t){
  if(typeof a==='number')return a+(b-a)*t;
  if(a==null||Array.isArray(a))return a;
  const o={};for(const k in a)o[k]=lerp(a[k],b[k],t);return o;
}
function M(base,over){ // mezcla profunda simple
  const o=JSON.parse(JSON.stringify(base));
  for(const k in over){ if(over[k]&&typeof over[k]==='object'&&!Array.isArray(over[k])) o[k]=Object.assign({},o[k]||{},over[k]); else o[k]=over[k]; }
  return o;
}
function pt(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}
const COL={skin:'#EDC3A5',skin2:'#CFA084',top:'#6F86C4',top2:'#4F64A0',leg:'#2C3550',leg2:'#4A5577',shoe:'#1B2232',hair:'#4A3428'};
const ORDER={side:['fa','fl','t','nl','na','h'],top:['fa','fl','na','nl','t','h'],front:['h','fa','na','t','fl','nl'],headv:['fl','nl','t','h','fa','na']};
function ln(a,b,w,c){return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`}
const mixp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function cap(H,center,span,r){let d='';for(let a=center-span;a<=center+span+0.1;a+=15){const q=add(H,dir(a),r);d+=(d?'L':'M')+pt(q)}return `<path d="${d}Z" fill="${COL.hair}"/>`}
function figureSVG(pose,view,ghost){
  view=view||'side';
  const P=[pose.px,pose.py], nr=dir(pose.T+90);
  const S=add(P,dir(pose.T),LEN.trunk*pose.lT);
  const mid=mixp(P,S,.5), C=add(mid,nr,pose.bend*2);
  const bz=t=>[(1-t)*(1-t)*P[0]+2*(1-t)*t*C[0]+t*t*S[0],(1-t)*(1-t)*P[1]+2*(1-t)*t*C[1]+t*t*S[1]];
  const H=add(S,dir(pose.hd),pose.hdist);
  const nS=add(S,nr,pose.w), fS=pose.farP?P:add(S,nr,-pose.w);
  const LR=pose.lr||P, nP=add(LR,nr,pose.w*.85), fP=add(LR,nr,-pose.w*.85);
  const arm=(root,a,near)=>{const e=add(root,dir(a.ua),LEN.ua*a.la), h=add(e,dir(a.fa),LEN.fa*a.la);
    const sk=near?COL.skin:COL.skin2, tp=near?COL.top:COL.top2;
    return ln(root,e,9.5,sk)+ln(e,h,8,sk)+ln(root,mixp(root,e,.42),12.5,tp)+`<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="4.8" fill="${sk}"/>`;};
  const leg=(root,a,near)=>{const k=add(root,dir(a.th),LEN.th*a.lt), an=add(k,dir(a.sh),LEN.sh*a.ls), to=add(an,dir(a.ft),LEN.ft*a.lf);
    const c=near?COL.leg:COL.leg2;
    return ln(an,to,8.5,COL.shoe)+ln(mixp(an,to,.2),to,2.5,'#ffffff')+`<circle cx="${an[0].toFixed(1)}" cy="${an[1].toFixed(1)}" r="4.2" fill="${COL.skin}"/>`+ln(k,mixp(k,an,.9),11.5,c)+ln(root,k,15.5,c);};
  const wide=view!=='side'&&pose.w>0, tw=wide?2*pose.w+10:(view==='headv'?32:22);
  const torso=()=>{let o=`<path d="M${pt(P)} Q${pt(C)} ${pt(S)}" fill="none" stroke="${COL.top}" stroke-width="${tw}" stroke-linecap="round"/>`;
    o+=`<path d="M${pt(P)} Q${pt(mixp(P,C,.3))} ${pt(bz(.3))}" fill="none" stroke="${COL.leg}" stroke-width="${tw+1}" stroke-linecap="round"/>`;
    if(wide)o+=ln(nS,fS,13,COL.top)+ln(nP,fP,15,COL.leg);
    o+=ln(S,mixp(S,H,.65),8.5,COL.skin);return o;};
  const head=()=>{let o=`<circle cx="${H[0].toFixed(1)}" cy="${H[1].toFixed(1)}" r="11" fill="${COL.skin}"/>`;
    if(view==='top'||view==='front'){o+=cap(H,pose.hd,80,11.6);}
    else{const face=pose.face!=null?pose.face:pose.hd+pose.fr;
      const pt2=add(H,dir(face+180+28),13);
      o+=`<circle cx="${pt2[0].toFixed(1)}" cy="${pt2[1].toFixed(1)}" r="5.2" fill="${COL.hair}"/>`+cap(H,face+180,105,11.8);
      const no=add(H,dir(face),10.3), ey=add(H,dir(face),5.6);
      o+=`<circle cx="${no[0].toFixed(1)}" cy="${no[1].toFixed(1)}" r="2.7" fill="${COL.skin}"/><circle cx="${ey[0].toFixed(1)}" cy="${ey[1].toFixed(1)}" r="1.4" fill="#18202E"/>`;}
    return o;};
  const parts={fa:()=>arm(fS,pose.f,false),fl:()=>leg(fP,pose.f,false),na:()=>arm(nS,pose.n,true),nl:()=>leg(nP,pose.n,true),t:torso,h:head};
  let s='';
  if(!ghost){
    if(view==='side') s+=`<rect x="10" y="147" width="220" height="6" rx="3" fill="#BFCBE8"/><line x1="6" y1="153.5" x2="234" y2="153.5" stroke="#C9D1E3" stroke-width="1.5"/>`;
    else if(view==='top'){const m=pose.mat||[74,6,92,154]; s+=`<rect x="${m[0]}" y="${m[1]}" width="${m[2]}" height="${m[3]}" rx="12" fill="#DCE4F4" stroke="#BFCBE8" stroke-width="2"/>`;}
    else s+=`<path d="M72 64 L168 64 L230 158 L10 158 Z" fill="#DCE4F4" stroke="#BFCBE8" stroke-width="2" stroke-linejoin="round"/>`;
  }
  s+=`<g transform="translate(120 150) scale(${pose.sc}) translate(-120 -150)"${ghost?' opacity=".17"':''}>`;
  for(const k of ORDER[view]) s+=parts[k]();
  return s+'</g>';
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function poseAt(frames,time){
  const total=frames.reduce((a,f)=>a+(f.t||1.4)+(f.hold||.5),0);
  let x=time%total;
  for(let i=0;i<frames.length;i++){
    const f=frames[i], prev=frames[(i-1+frames.length)%frames.length], mv=f.t||1.4, hd=f.hold||.5;
    if(x<mv) return {pose:lerp(prev.np,f.np,ease(x/mv)),label:f.label};
    x-=mv;
    if(x<hd) return {pose:f.np,label:f.label};
    x-=hd;
  }
  return {pose:frames[0].np,label:frames[0].label};
}
const ANIMS=new Set();
function mountAnim(el,exId){
  const ex=EX[exId]; if(!ex) return;
  ex.anim.forEach(f=>{ if(!f.np) f.np=norm(f.p); });
  const VT={top:'Vista desde arriba',front:'Vista desde los pies',headv:'Vista desde la cabeza'};
  el.innerHTML=`<svg viewBox="${ex.vb||'0 0 240 165'}" role="img" aria-label="Simulación: ${ex.name}"></svg><div class="lab"></div>${VT[ex.view]?'<div class="vt">'+VT[ex.view]+'</div>':''}<div class="pz">toca para pausar</div>`;
  const gi=ex.ghost==null?(ex.anim.length>1?1:-1):ex.ghost;
  ex._ghost=gi>=0?figureSVG(ex.anim[gi].np,ex.view,true):'';
  const a={el,svg:el.firstChild,lab:el.querySelector('.lab'),ex,t0:performance.now(),paused:false,pt:0,lastLab:''};
  el.onclick=()=>{a.paused=!a.paused; if(a.paused)a.pt=performance.now(); else a.t0+=performance.now()-a.pt; el.querySelector('.pz').textContent=a.paused?'pausado · toca para seguir':'toca para pausar';};
  ANIMS.add(a); drawAnim(a,performance.now());
}
function drawAnim(a,now){
  const tt=((a.paused?a.pt:now)-a.t0)/1000;
  const r=poseAt(a.ex.anim,tt);
  const fg=figureSVG(r.pose,a.ex.view); const cut=fg.indexOf('<g transform'); a.svg.innerHTML=fg.slice(0,cut)+(a.ex.props||'')+a.ex._ghost+fg.slice(cut);
  if(r.label!==a.lastLab){a.lab.textContent=r.label;a.lastLab=r.label;}
}
function loop(now){
  const vh=innerHeight;
  for(const a of ANIMS){
    if(!a.el.isConnected){ANIMS.delete(a);continue;}
    const b=a.el.getBoundingClientRect(); if(b.bottom<0||b.top>vh) continue;
    drawAnim(a,now);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function nextMonday(){const d=new Date();const k=(8-d.getDay())%7;d.setDate(d.getDate()+k);return iso(d)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}

function sessionDate(w,s){ // fecha planeada
  const st=parse(D.client.start); const monday=new Date(st); monday.setDate(st.getDate()-((st.getDay()+6)%7)+(w-1)*7);
  const dw=D.client.days[s==='A'?0:1]; const d=new Date(monday); d.setDate(monday.getDate()+((dw+6)%7)); return d;
}
function currentWeek(){
  const st=parse(D.client.start), t=new Date(); t.setHours(0,0,0,0);
  const diff=Math.floor((t-st)/864e5); if(diff<0)return 0; return Math.min(8,Math.floor(diff/7)+1);
}

function history(id){
  const out=[];
  for(const s of SESSIONS){const L=D.logs[s.key];if(L&&L.ex&&L.ex[id]&&L.ex[id].done)out.push({key:s.key,w:s.w,s:s.s,...L.ex[id]});}
  return out;
}
function suggest(id,planLvl,beforeKey){
  let h=history(id);
  if(beforeKey){const idx=SESSIONS.findIndex(s=>s.key===beforeKey);h=h.filter(x=>SESSIONS.findIndex(s=>s.key===x.key)<idx);}
  const last=h[h.length-1], prev=h[h.length-2];
  const max=EX[id].levels.length;
  if(!last)return{lvl:planLvl,tag:'Nivel del plan',cls:'',why:'Primera vez que se hace.'};
  const rated=x=>x&&x.pain&&x.disc;
  if(rated(last)&&(last.pain>=4||last.disc>=5)){const l=Math.max(1,(last.lvl||1)-1);return{lvl:l,tag:'Bajar nivel',cls:'bad',why:`La última vez: dolor ${last.pain}, incomodidad ${last.disc}.`};}
  if(rated(last)&&rated(prev)&&last.pain<=2&&prev.pain<=2&&last.disc<=3&&prev.disc<=3&&last.lvl===prev.lvl){
    const l=Math.min(max,Math.max(planLvl,(last.lvl||1)+1));
    return l>(last.lvl||1)?{lvl:l,tag:'Lista para subir',cls:'ok',why:'Dos sesiones seguidas con dolor 1 a 2 e incomodidad hasta 3.'}:{lvl:l,tag:'Nivel máximo',cls:'ok',why:'Ya está en el nivel más alto. Mejora la calidad.'};
  }
  if(rated(last)&&last.pain===3)return{lvl:last.lvl||planLvl,tag:'Mantener',cls:'warn',why:'Dolor 3 la última vez: repetir igual antes de avanzar.'};
  return{lvl:Math.max(1,Math.min(max,Math.max(last.lvl||1,planLvl>(last.lvl||1)+1?(last.lvl||1)+1:last.lvl||1))),tag:'Mantener',cls:'',why:'Falta otra sesión cómoda para subir.'};
}

function lineChart(series,labels){
  const W=320,H=150,l=24,r=8,t=10,b=24,n=labels.length;
  const x=i=>l+(n<=1?0:i*(W-l-r)/(n-1)), y=v=>t+(5-v)*(H-t-b)/4;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let v=1;v<=5;v++)s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#E4E9F6"/><text x="${l-8}" y="${y(v)+4}" font-size="10" fill="#5B6478" text-anchor="end">${v}</text>`;
  labels.forEach((lb,i)=>{if(n<=10||i%2===0)s+=`<text x="${x(i)}" y="${H-6}" font-size="9" fill="#5B6478" text-anchor="middle">${lb}</text>`});
  for(const se of series){const pts=se.v.map((v,i)=>v?[x(i),y(v)]:null);
    let d='';pts.forEach(p=>{if(p)d+=(d?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)});
    if(d)s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2.5" stroke-linejoin="round" ${se.dash?'stroke-dasharray="5 4"':''}/>`;
    pts.forEach(p=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${se.c}"/>`});}
  return s+'</svg>';
}
function vProg(){

  let h='';
  if(!ss.length){app.innerHTML=`<div class="card"><h3>Aún no hay sesiones</h3><p class="small muted">Cuando registres la primera sesión aquí verás la evolución del dolor y la incomodidad, y en qué nivel va cada ejercicio.</p></div>`;return}

  const avg=(k,f)=>{const v=Object.values(D.logs[k].ex||{}).map(e=>e[f]).filter(Boolean);return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null};
  h+=`<div class="card chart"><h3>Dolor general por sesión</h3>${lineChart([{v:ss.map(s=>D.logs[s.key].pre),c:'#A8443A',dash:true},{v:ss.map(s=>D.logs[s.key].post),c:'#5E76B3'}],lab)}

  h+=`<div class="card chart"><h3>Promedio en los ejercicios</h3>${lineChart([{v:ss.map(s=>avg(s.key,'pain')),c:'#A8443A'},{v:ss.map(s=>avg(s.key,'disc')),c:'#A8741A',dash:true}],lab)}
  <div class="legend"><span><i style="background:#A8443A"></i>dolor</span><span><i style="background:#A8741A"></i>incomodidad</span></div></div>`;
  const rad=ss.filter(s=>D.logs[s.key].rad).length;

  h+=`<div class="card"><h3>Resumen</h3><div class="small">Sesiones registradas: <b>${ss.length}</b> de 16<br>Dolor al llegar: <b>${D.logs[first.key].pre||'-'}</b> (primera) → <b>${D.logs[last.key].pre||'-'}</b> (última)<br>Sesiones con síntomas en la pierna: <b>${rad}</b></div>

  for(const id of Object.keys(EX)){const hs=history(id);if(!hs.length)continue;const l=hs[hs.length-1],f=hs[0];
    const pl=PH.flatMap(p=>[...p.A,...p.B]).filter(x=>x[0]===id).map(x=>x[1]);const sg=suggest(id,pl.length?Math.min(...pl):1);
    h+=`<tr><td><b>${EX[id].name}</b><div class="muted small">${hs.length} veces</div></td><td>N${l.lvl||'?'}</td><td>${f.pain||'-'}→${l.pain||'-'}</td><td>${f.disc||'-'}→${l.disc||'-'}</td><td><span class="pill ${sg.cls}">${sg.tag}</span></td></tr>`;}
  h+='</table></div>';
  app.innerHTML=h;

function vAjustes(){
  const c=D.client;
  let h=`<div class="card"><h3>Datos de la clienta</h3><div class="qlab">Nombre</div><input type="text" value="${esc(c.name)}" onchange="D.client.name=this.value;save();render()">
  <div class="qlab">Fecha de inicio (semana 1)</div><input type="date" value="${c.start}" onchange="D.client.start=this.value;save();render()">
  <div class="qlab">Días de entrenamiento</div><div class="row"><select onchange="D.client.days[0]=+this.value;save();render()">${DOW.map((d,i)=>`<option value="${i}" ${c.days[0]===i?'selected':''}>Sesión A: ${d}</option>`).join('')}</select>
  <select onchange="D.client.days[1]=+this.value;save();render()">${DOW.map((d,i)=>`<option value="${i}" ${c.days[1]===i?'selected':''}>Sesión B: ${d}</option>`).join('')}</select></div>
  <div class="qlab">Diagnóstico y notas médicas</div><textarea onchange="D.client.notes=this.value;save()" placeholder="Nivel de la hernia, indicaciones del médico, movimientos que le molestan…">${esc(c.notes)}</textarea></div>`;
  h+=`<div class="card"><h3>Cómo se usa la escala</h3><div class="small"><b>Dolor</b>: ${[1,2,3,4,5].map(v=>v+' '+PAIN[v]).join(' · ')}<br><b>Incomodidad</b>: ${[1,2,3,4,5].map(v=>v+' '+DISC[v]).join(' · ')}</div>
  <div class="small" style="margin-top:8px"><span class="pill ok">Subir nivel</span> dos sesiones seguidas con dolor 1 a 2 e incomodidad hasta 3, en el mismo nivel y con buena técnica.<br><span class="pill warn" style="margin-top:4px">Mantener</span> dolor 3, o solo una sesión cómoda.<br><span class="pill bad" style="margin-top:4px">Bajar nivel</span> dolor 4 o 5, o incomodidad 5. Si además baja a la pierna, se suspende ese ejercicio.</div>
  <div class="small" style="margin-top:10px"><b>Si un ejercicio duele o incomoda, en este orden:</b><br>1. Menos rango y más lento.<br>2. Bajar un nivel.<br>3. Usar la modificación del ejercicio.<br>4. Cambiarlo por la alternativa (botón dentro de la sesión, solo cambia esa sesión).<br>5. Quitarlo, anotarlo y consultarlo con su médico o fisio.</div></div>`;
  h+=`<div class="redflag"><b>Señales para parar y mandarla con su médico</b>Pérdida de fuerza en una pierna o pie, adormecimiento en la zona de la entrepierna, cambios para controlar la orina o el intestino, dolor que baja por la pierna y empeora sesión tras sesión, o dolor fuerte de noche que no cambia con la posición.</div>`;
  h+=`<div class="card" style="margin-top:12px"><h3>Respaldo</h3><p class="small muted">Todo se guarda en este teléfono, sin internet. Descarga un respaldo de vez en cuando.</p>
  <div class="row"><button class="btn ghost" onclick="backup()">Descargar respaldo</button><label class="btn ghost" style="display:inline-block">Cargar respaldo<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div></div>`;
  h+=`<div class="foot"><span class="logo"><i>m</i>erkha</span>Programa diseñado para ${esc(D.client.name||'Paola')} · @merkhamedia</div>`;
  app.innerHTML=h;
}
function backup(){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='espalda-en-calma-'+(D.client.name||'Paola').replace(/\s+/g,'-')+'-'+iso(new Date())+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.client||!x.logs)throw 0;D=x;save();toast('Respaldo cargado');render()}catch(e){toast('Ese archivo no es un respaldo válido')}};r.readAsText(f)}

render();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
